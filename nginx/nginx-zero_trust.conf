# Nginx - MODO ZERO TRUST
# Autenticação mútua (mTLS): além do certificado do servidor, o cliente precisa
# apresentar um certificado de dispositivo emitido pela CA do laboratório.
# Conexões sem certificado válido são recusadas antes de chegar ao gateway.

events {}

http {
  # Resolve o nome "gateway" no DNS interno do Docker a cada 10 s, em vez de só
  # na inicialização. Assim o Nginx acompanha o gateway quando ele é recriado.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate        /etc/nginx/certs/server.crt;
    ssl_certificate_key    /etc/nginx/certs/server.key;
    ssl_protocols          TLSv1.3;

    # mTLS: exige certificado do cliente assinado pela CA do laboratório
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      on;

    # Resposta em JSON quando o cliente não apresenta certificado válido
    error_page 400 495 496 = @sem_certificado;
    location @sem_certificado {
      default_type application/json;
      return 403 '{"decisao": "negado", "motivo": "certificado de dispositivo ausente ou inválido"}';
    }

    location / {
      set $gateway http://gateway:8000;
      proxy_pass $gateway;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      # Repassa ao gateway a identidade do dispositivo verificada pelo Nginx.
      # proxy_set_header sobrescreve qualquer valor enviado pelo cliente.
      proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
      proxy_set_header X-Client-Cert-DN     $ssl_client_s_dn;
    }
  }
}
