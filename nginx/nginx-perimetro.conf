# Nginx - MODO PERÍMETRO
# Termina o TLS e repassa as requisições ao gateway.
# Só o servidor se autentica (TLS comum): qualquer computador consegue se conectar.

events {}

http {
  # Resolve o nome "gateway" no DNS interno do Docker a cada 10 s, em vez de só
  # na inicialização. Assim o Nginx acompanha o gateway quando ele é recriado.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.3;

    location / {
      set $gateway http://gateway:8000;
      proxy_pass $gateway;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      # Garante que o cliente não consiga forjar informações de certificado
      proxy_set_header X-Client-Cert-Verify "";
      proxy_set_header X-Client-Cert-DN "";
    }
  }
}
